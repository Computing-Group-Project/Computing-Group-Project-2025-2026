services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: demeter_db
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./ai-service
    environment:
      DEMETER_AI_API_KEY: ${DEMETER_AI_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/demeter_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DEMETER_AI_API_KEY: ${DEMETER_AI_API_KEY}
      DEMETER_AI_BASE_URL: http://ai-service:8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/cafeterias"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend/demeter-frontend
    ports:
      - "3000:80"
      - "3443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3

  db-backup:
    profiles:
      - backup
    image: mysql:8.0
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      /bin/sh -c '
      while true; do
        TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
        mysqldump --host=mysql --user=root --single-transaction --routines --triggers --set-gtid-purged=OFF demeter_db 2>/dev/null | gzip > /backups/demeter_$${TIMESTAMP}.sql.gz;
        echo "[$$TIMESTAMP] Backup complete: $$(du -h /backups/demeter_$${TIMESTAMP}.sql.gz | cut -f1)";
        COUNT=$$(ls -1 /backups/demeter_*.sql.gz 2>/dev/null | wc -l);
        if [ "$$COUNT" -gt 288 ]; then
          ls -1t /backups/demeter_*.sql.gz | tail -n +289 | xargs rm -f;
        fi;
        sleep 300;
      done'
    restart: unless-stopped

volumes:
  mysql_data:
