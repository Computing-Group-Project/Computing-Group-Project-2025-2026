server:
  port: 8080

spring:
  application:
    name: demeter-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/demeter_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    database-platform: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 7200000

wallet:
  micro:
    max-amount: 500

# Custom Application Properties
app:
  base-url: http://localhost:8080
  uploads-dir: uploads
  max-file-bytes: 5242880

# Swagger (disable in production via SPRINGDOC_API_DOCS_ENABLED=false)
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}

# AI Service Configuration
demeter:
  ai-service:
    base-url: ${DEMETER_AI_BASE_URL:http://localhost:8001}
    api-key: ${DEMETER_AI_API_KEY}

