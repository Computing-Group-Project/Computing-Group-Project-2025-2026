server:
  port: 8080

spring:
  application:
    name: demeter-backend

  datasource:
    url: jdbc:mysql://localhost:3306/demeter_db
    username: root
    password: Password123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY_32+_CHARS"
  expiration-ms: 3600000

wallet:
  micro:
    max-amount: 500

# Custom Application Properties
app:
  base-url: http://localhost:8080
  uploads-dir: uploads
  max-file-bytes: 5242880

# AI Service Configuration
demeter:
  ai-service:
    base-url: ${DEMETER_AI_BASE_URL:http://localhost:8001}
    api-key: ${DEMETER_AI_API_KEY:demeter-ai-service-key-2024}

