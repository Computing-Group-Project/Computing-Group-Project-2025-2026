spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  aop:
    auto: true
    proxy-target-class: true

demeter:
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
    api-key: ${AI_SERVICE_API_KEY:demeter-ai-service-key-2024}
    connect-timeout: 5000
    read-timeout: 30000
    max-retries: 3
    retry-delay-ms: 1000
    enable-fallback: true
    cache-recommendations: true