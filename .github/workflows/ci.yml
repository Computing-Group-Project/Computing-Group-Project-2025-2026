name: Demeter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Backend: Build & Test ──
  # Tests use H2 in-memory database (src/test/resources/application.properties)
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        run: cd backend && mvn clean verify

  # ── Frontend: Lint & Build ──
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/demeter-frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend/demeter-frontend && npm ci

      - name: Lint
        run: cd frontend/demeter-frontend && npm run lint

      - name: Run tests
        run: cd frontend/demeter-frontend && npx vitest run

      - name: Build
        run: cd frontend/demeter-frontend && npm run build

  # ── AI Service: Install & Validate ──
  ai-service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: cd ai-service && pip install -r requirements.txt

      - name: Download NLTK data
        run: |
          cd ai-service
          python -c "
          import nltk
          nltk.download('vader_lexicon', quiet=True)
          nltk.download('punkt', quiet=True)
          nltk.download('punkt_tab', quiet=True)
          nltk.download('stopwords', quiet=True)
          nltk.download('words', quiet=True)
          print('NLTK data downloaded successfully')
          "

      - name: Run tests
        run: cd ai-service && python -m pytest tests/test_endpoints.py -v
